[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-studio5k"
version = "0.1.0"
description = "Local MCP server for authoring Rockwell Studio 5000 logic offline via L5X"
requires-python = ">=3.12,<3.14"
dependencies = [
    "lxml>=5",
    "defusedxml>=0.7",
    "psutil>=5.9",
]

[project.scripts]
mcp-studio5k = "mcp_studio5k.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
]
server = [
    "fastmcp>=0.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
